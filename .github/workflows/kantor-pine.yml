# Kantor Pine XAUUSD — uji mesin analisis, lalu perbarui mapping server tiap jam.
# Aplikasi diterbitkan oleh GitHub Pages repo ini (deploy dari branch) di /kantor-pine/app/.
name: Kantor Pine XAUUSD

on:
  push:
    branches: [main]
    paths: ['kantor-pine/**', '.github/workflows/kantor-pine.yml']
  pull_request:
    paths: ['kantor-pine/**', '.github/workflows/kantor-pine.yml']
  schedule:
    - cron: '7 * * * *'     # tiap jam, 7 hari (kripto buka 24/7; emas tetap dipetakan untuk pembukaan)
  workflow_dispatch:

concurrency:
  group: kantor-pine
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Uji mesin analisis & ekspor
        run: node kantor-pine/scripts/test-engine.mjs

  mapping:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Data pasar (candle H1/M15 asli, DXY, yield riil, kalender)
        run: node kantor-pine/scripts/build-market.mjs
      - name: Agent Kabar (berita RSS + skor sentimen)
        continue-on-error: true
        run: node kantor-pine/scripts/run-news.mjs
      - name: Backtest & kalibrasi (sekali sehari, otomatis dilewati bila masih baru)
        continue-on-error: true
        run: node kantor-pine/scripts/calibrate.mjs ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - name: Jalankan tim agent (mapping server + arsip)
        run: node kantor-pine/scripts/run-mapping.mjs
      - name: Nilai mapping yang diarsipkan (rekam jejak live)
        continue-on-error: true
        run: node kantor-pine/scripts/score-archive.mjs
      - name: Kripto 24/7 — peringkat volatilitas harian & data 5 aset teratas
        continue-on-error: true
        run: node kantor-pine/scripts/build-crypto.mjs
      - name: Kripto 24/7 — berita, kalibrasi, mapping, penilaian per aset
        continue-on-error: true
        run: |
          F=kantor-pine/app/data/aset.json
          [ -f "$F" ] || exit 0
          FORCE="${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}"
          for id in $(node -e "console.log(require('./$F').aktif.join(' '))"); do
            nama=$(node -e "console.log(require('./$F').daftar.find(a=>a.id==='$id').nama)")
            node kantor-pine/scripts/run-news.mjs --aset "$id" --nama "$nama" || true
            node kantor-pine/scripts/calibrate.mjs --aset "$id" $FORCE || true
            node kantor-pine/scripts/run-mapping.mjs --aset "$id" || true
            node kantor-pine/scripts/score-archive.mjs --aset "$id" || true
          done
      - name: Simpan hasil
        run: |
          git config user.name "kantor-pine-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kantor-pine/app/data kantor-pine/app/ea
          git diff --cached --quiet && exit 0
          git commit -m "Mapping server $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push || (git pull --rebase origin main && git push)
