# Kantor Pine — uji mesin analisis (push/PR), lalu perbarui data & mapping semua aset tiap jam.
# Aplikasi diterbitkan oleh GitHub Pages repo ini (deploy dari branch) di /kantor-pine/app/.
name: Kantor Pine

on:
  push:
    branches: [main]
    paths: ['kantor-pine/app/*.js', 'kantor-pine/scripts/**', 'lama/**', '.github/workflows/kantor-pine.yml']
  pull_request:
    paths: ['kantor-pine/**', 'lama/**', '.github/workflows/kantor-pine.yml']
  schedule:
    - cron: '7 * * * *'     # tiap jam, 7 hari (kripto buka 24/7; emas tetap dipetakan untuk pembukaan)
  workflow_dispatch:
    inputs:
      rantai:
        description: 'Dipicu otomatis oleh run sebelumnya (tanpa kalibrasi paksa)'
        type: boolean
        default: false

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Uji mesin analisis & ekspor
        run: node kantor-pine/scripts/test-engine.mjs && node --check kantor-pine/lokal/kantor.mjs
      - name: Uji aplikasi lama (/lama)
        run: node lama/test/test_app.js

  mapping:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: kantor-pine-mapping
      cancel-in-progress: false
    timeout-minutes: 25
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Data pasar emas (candle H1/M15 asli, DXY, yield riil, kalender)
        continue-on-error: true
        run: node kantor-pine/scripts/build-market.mjs
      - name: Agent Kabar (berita RSS + skor sentimen)
        continue-on-error: true
        run: node kantor-pine/scripts/run-news.mjs
      - name: Backtest & kalibrasi (sekali sehari, otomatis dilewati bila masih baru)
        continue-on-error: true
        run: node kantor-pine/scripts/calibrate.mjs ${{ github.event_name == 'workflow_dispatch' && !inputs.rantai && '--force' || '' }}
      - name: Jalankan tim agent emas (mapping server + arsip)
        continue-on-error: true
        run: node kantor-pine/scripts/run-mapping.mjs
      - name: Nilai mapping yang diarsipkan (rekam jejak live)
        continue-on-error: true
        run: node kantor-pine/scripts/score-archive.mjs
      - name: Aset lain — peringkat volatilitas kripto harian & data semua aset (kripto, forex, indeks)
        continue-on-error: true
        run: node kantor-pine/scripts/build-crypto.mjs
      - name: Aset lain — berita, kalibrasi, mapping, penilaian per aset
        continue-on-error: true
        run: |
          F=kantor-pine/app/data/aset.json
          [ -f "$F" ] || exit 0
          FORCE="${{ github.event_name == 'workflow_dispatch' && !inputs.rantai && '--force' || '' }}"
          for id in $(node -e "console.log(require('./$F').aktif.join(' '))"); do
            nama=$(node -e "console.log(require('./$F').daftar.find(a=>a.id==='$id').nama)")
            node kantor-pine/scripts/run-news.mjs --aset "$id" --nama "$nama" || true
            node kantor-pine/scripts/calibrate.mjs --aset "$id" $FORCE || true
            node kantor-pine/scripts/run-mapping.mjs --aset "$id" || true
            node kantor-pine/scripts/score-archive.mjs --aset "$id" || true
          done
      - name: Kesehatan sistem (status.json + ringkasan run)
        if: always()
        run: node kantor-pine/scripts/status.mjs
      - name: Simpan hasil
        if: always()
        run: |
          git config user.name "kantor-pine-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kantor-pine/app/data kantor-pine/app/ea
          git diff --cached --quiet && exit 0
          git commit -m "Mapping server $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push || (git pull --rebase origin main && git push)

  lanjut:
    # Jadwal cadangan: cron GitHub sering telat atau terlewat berjam-jam. Run ini menunggu sampai menit :07
    # berikutnya lalu memicu run baru, sehingga mapping tetap tiap jam 24/7. Bila ada run terjadwal/manual
    # yang lebih baru sedang berjalan, run itu yang melanjutkan (rantai tidak pernah berlipat).
    needs: mapping
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      actions: write
    steps:
      - name: Tunggu menit :07 berikutnya, lalu picu run berikutnya
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ME: ${{ github.run_id }}
        run: |
          s=$(( $(date -u +%s) % 3600 )); w=$(( (420 - s + 3600) % 3600 ))
          echo "Menunggu $w detik"; sleep $w
          newer=0
          for st in queued in_progress waiting pending requested; do
            c=$(gh api "repos/$REPO/actions/workflows/kantor-pine.yml/runs?status=$st&per_page=50" \
                --jq "[.workflow_runs[] | select(.id > $ME and (.event == \"schedule\" or .event == \"workflow_dispatch\"))] | length")
            newer=$(( newer + c ))
          done
          if [ "$newer" -gt 0 ]; then echo "Ada run lebih baru ($newer) — dia yang melanjutkan."; exit 0; fi
          gh workflow run kantor-pine.yml --repo "$REPO" --ref main -f rantai=true
          echo "Run berikutnya dipicu."
